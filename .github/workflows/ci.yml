name: Greenfield Full-Stack CI

on:
  push:
    branches: [greenfield/mvp]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend-and-postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: athera_dev_admin
          POSTGRES_PASSWORD: ci_disposable_admin_pw
          POSTGRES_DB: postgres
        ports:
          - 55433:5432
        options: >-
          --health-cmd "pg_isready -U athera_dev_admin -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      ATHERA_TEST_PG_ADMIN: "Host=127.0.0.1;Port=55433;Username=athera_dev_admin;Password=ci_disposable_admin_pw;Database=postgres"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: dotnet restore Orphac.Athera.sln
      - run: dotnet build Orphac.Athera.sln --no-restore -c Release
      - run: dotnet test Orphac.Athera.sln --no-build -c Release

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.18.0"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run api:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
